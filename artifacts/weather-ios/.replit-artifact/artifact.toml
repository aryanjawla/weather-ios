kind = "mobile"
previewPath = "/weather-ios/"
title = "Weather"
description = "A polished iOS weather app for checking current conditions and upcoming forecasts with a focused, mobile-first experience."
version = "1.0.0"
id = "artifacts/weather-ios"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/weather-ios/" ]
localPort = 20619

[services.development]
run = "pnpm --filter @workspace/weather-ios run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/weather-ios", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/weather-ios", "run", "serve" ]

[services.env]
PORT = "20619"
BASE_PATH = "/weather-ios/"
